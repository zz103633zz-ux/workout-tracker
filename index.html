<style>
:root{--bg:#111318;--card:#1b1e25;--card2:#262a33;--line:rgba(255,255,255,.08);--tx:#f3f4f6;--tx2:#a3a8b3;--tx3:#6b7180;--ac:#ff7a1a;--acd:rgba(255,122,26,.16);--ok:#22c55e;--okd:rgba(34,197,94,.18);--bad:#ef4444;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}

input:focus,select:focus{border-color:var(--ac)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 96px)}
h1{font-size:28px;font-weight:800;margin:6px 2px 14px}
h2{font-size:17px;font-weight:700;margin:18px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:11px;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;background:var(--card2);font-weight:600}
.btn.pri{background:var(--ac);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:rgba(239,68,68,.15);color:var(--bad)}.btn.full{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,19,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(var(--sb) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx3);min-height:50px;justify-content:center}
.tabs button b{font-size:22px;line-height:1}.tabs button.on{color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--tx2)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px}
.list-item:last-child{border-bottom:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card2);font-size:14px;color:var(--tx2)}.chip.on{background:var(--ac);color:#fff}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 40px);display:none}
.sheet.on{display:block}.sheet>div{max-width:560px;margin:0 auto}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sb) + 20px)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.ex-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ex-h .t{font-weight:700;color:var(--ac);font-size:16px;flex:1}
.set{display:grid;grid-template-columns:38px 1fr 72px 62px 46px;gap:6px;align-items:center;padding:4px 0;border-radius:10px}
.set.hd{font-size:11px;color:var(--tx3);text-align:center}
.set input{text-align:center;padding:9px 4px;min-height:40px}
.set.done{background:var(--okd)}.set.done input{background:transparent;border-color:transparent}
.stype{height:38px;border-radius:10px;background:var(--card2);font-weight:700;font-size:14px}
.stype.W{color:#facc15}.stype.F{color:var(--bad)}.stype.D{color:#60a5fa}
.prev{font-size:12px;color:var(--tx3);text-align:center;white-space:nowrap;overflow:hidden}
.chk{height:40px;border-radius:10px;background:var(--card2);font-size:18px;color:var(--tx3)}.set.done .chk{background:var(--ok);color:#fff}
.restbar{position:sticky;top:calc(-10px - var(--st));z-index:45;background:#20242c;border:1px solid var(--line);border-radius:0 0 16px 16px;margin:calc(-10px - var(--st)) -14px 10px;padding:calc(var(--st) + 10px) 14px 10px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.restbar.on{display:block}.restbar .in{max-width:560px;margin:0 auto}
.prog{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ac);transition:width 1s linear}
.floatbar{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 72px);z-index:25;max-width:536px;margin:0 auto;background:var(--ac);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px}
.cal .h{aspect-ratio:auto;font-size:11px;color:var(--tx3)}.cal .w{background:var(--ac);color:#fff;font-weight:700}.cal .td{outline:1px solid var(--ac)}
svg text{fill:var(--tx3);font-size:10px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:#333a46;padding:10px 18px;border-radius:12px;z-index:99;display:none;font-size:14px}
.field{margin-bottom:10px}.field label{display:block;font-size:13px;color:var(--tx2);margin:0 2px 4px}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;min-height:110px}
.plate{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;writing-mode:vertical-rl}
.wcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;transition:transform .15s}
.wcard.dsrc{opacity:.35}.wcard.dtgt{outline:3px solid #ff9f0a!important;outline-offset:2px}
.wcard.dtgt::after{content:'放開即合併';position:absolute;top:8px;right:8px;background:#ff9f0a;color:#111;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.dghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;transform:scale(1.03) rotate(-1deg);box-shadow:0 12px 30px rgba(0,0,0,.5);margin:0!important}
body.dragging{overflow:hidden;touch-action:none}
</style>

<script>

['bench','槓鈴臥推','胸','bb'],['incbench','上斜槓鈴臥推','胸','bb'],['declbench','下斜槓鈴臥推','胸','bb'],['dbbench','啞鈴臥推','胸','db'],['incdb','上斜啞鈴臥推','胸','db'],['dbfly','啞鈴飛鳥','胸','db'],['cablefly','繩索夾胸','胸','cb'],['pecdeck','蝴蝶機夾胸','胸','mc'],['chestpress','坐姿胸推機','胸','mc'],['pushup','伏地挺身','胸','bw'],['dip','雙槓撐體','胸','bw'],

['squat','深蹲','腿','bb'],['frontsq','前蹲舉','腿','bb'],['rdl','羅馬尼亞硬舉','腿','bb'],['legpress','腿推機','腿','mc'],['hack','哈克深蹲','腿','mc'],['lunge','啞鈴弓箭步','腿','db'],['bulg','保加利亞分腿蹲','腿','db'],['legext','腿伸屈機','腿','mc'],['legcurl','腿後勾機','腿','mc'],['hipthrust','臀推','腿','bb'],['calf','站姿提踵','腿','mc'],['goblet','高腳杯深蹲','腿','db'],
['ohp','槓鈴肩推','肩','bb'],['dbpress','啞鈴肩推','肩','db'],['latraise','啞鈴側平舉','肩','db'],['cablelat','繩索側平舉','肩','cb'],['frontraise','啞鈴前平舉','肩','db'],['revfly','反向飛鳥','肩','db'],['arnold','阿諾推舉','肩','db'],['shrug','啞鈴聳肩','肩','db'],['uprow','直立划船','肩','bb'],
['bbcurl','槓鈴二頭彎舉','手臂','bb'],['dbcurl','啞鈴二頭彎舉','手臂','db'],['hammer','錘式彎舉','手臂','db'],['preacher','牧師椅彎舉','手臂','mc'],['cablecurl','繩索彎舉','手臂','cb'],['pushdown','繩索三頭下壓','手臂','cb'],['skull','仰臥三頭伸展','手臂','bb'],['ohext','啞鈴過頭三頭伸展','手臂','db'],['cgbench','窄握臥推','手臂','bb'],
['plank','棒式','核心','bw'],['crunch','捲腹','核心','bw'],['legraise','懸垂舉腿','核心','bw'],['cablecr','繩索跪姿捲腹','核心','cb'],['abwheel','健腹輪','核心','ot'],['russian','俄羅斯轉體','核心','bw'],

['bwsquat','自重深蹲','腿','bw'],['bandsquat','彈力繩深蹲（膝上圈）','腿','band'],['bandbridge','彈力繩臀橋','腿','band'],['bandthrust','彈力繩臀推','腿','band'],['bandwalk','彈力繩蟹行側走','腿','band'],['bandabd','彈力繩站姿側抬腿','腿','band'],['bandkick','彈力繩後踢腿','腿','band'],['firehyd','消防栓','腿','bw'],['bandrdl','彈力繩羅馬尼亞硬舉','腿','band'],['bwlunge','自重弓箭步','腿','bw'],['revlunge','後跨弓箭步','腿','bw'],
['bandrow','彈力繩划船','背','band'],['bandpa','彈力繩拉開','背','band'],['bandpress','彈力繩肩推','肩','band'],['kneepush','跪姿伏地挺身','胸','bw'],['bandcurl','彈力繩二頭彎舉','手臂','band'],['bandtri','彈力繩三頭伸展','手臂','band'],
['deadbug','死蟲','核心','bw'],['birddog','鳥狗式','核心','bw'],['sideplank','側棒式','核心','bw']
].map(a=>({id:a[0],name:a[1],part:a[2],eq:a[3]}));
const STYPE={N:'正式',W:'熱身',F:'力竭',D:'遞減'};
const TORDER=['N','W','F','D'];
const KEY='wt-data-v1';
let S;
function defTemplates(){const t=(name,ex)=>({id:uid(),name,ex:ex.map(e=>({id:e[0],n:e[1],w:0,r:e[2]}))});return[
t('推日（胸肩三頭）',[['bench',4,8],['incdb',3,10],['ohp',3,8],['latraise',3,15],['pushdown',3,12]]),
t('拉日（背二頭）',[['deadlift',3,5],['pullup',3,8],['bbrow',3,10],['facepull',3,15],['bbcurl',3,10]]),
t('腿日',[['squat',4,6],['rdl',3,10],['legpress',3,12],['legcurl',3,12],['calf',4,15]]),
t('上半身',[['bench',4,8],['seatrow',4,10],['dbpress',3,10],['latpd',3,10],['hammer',3,12]]),
t('下半身',[['squat',4,8],['rdl',3,10],['bulg',3,10],['legext',3,12],['plank',3,1]]),
t('全身入門',[['goblet',3,10],['dbbench',3,10],['seatrow',3,10],['dbpress',3,10],['plank',3,1]])]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S)S={custom:[],workouts:[],templates:defTemplates(),bw:[],settings:{rest:90,unit:'kg',bar:20},active:null,rest:null};
 S.settings=Object.assign({rest:90,unit:'kg',bar:20},S.settings||{});['custom','workouts','templates','bw'].forEach(k=>S[k]=S[k]||[]);ensurePlan()}
function save(){localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v))}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=()=>S.settings.unit;
function exById(id){return LIB.find(e=>e.id===id)||S.custom.find(e=>e.id===id)||{id,name:'(已刪除動作)',part:'',eq:'ot'}}
function allEx(){return LIB.concat(S.custom)}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')}
function fmtDurZh(ms){const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' 小時 '+(m%60)+' 分':m+' 分鐘'}
function dstr(ts){const d=new Date(ts);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）'}
function dkey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const nf=n=>Math.round(n*10)/10;
const kfmt=n=>n>=10000?nf(n/1000)+'k':String(Math.round(n));
function e1rm(w,r){return r>0&&w>0?(r===1?w:w*(1+r/30)):0}
function setDone(s){return s.done&&(+s.r>0||+s.m>0||+s.sec>0)}
function wVol(w){let v=0,n=0;w.ex.forEach(e=>e.sets.forEach(s=>{if(setDone(s)&&s.t!=='W'){v+=(+s.w||0)*(+s.r||0);n++}}));return{v,n}}
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
const GCOL=['#38bdf8','#a78bfa','#f472b6','#facc15','#34d399','#fb7185'];
function gInfo(arr){const cnt={};arr.forEach(e=>{if(e.g)cnt[e.g]=(cnt[e.g]||0)+1});const L={},pos={};let k=0;return arr.map(e=>{if(!e.g||cnt[e.g]<2)return null;if(!(e.g in L)){L[e.g]=String.fromCharCode(65+k);pos[e.g]=0;k++}pos[e.g]++;return{L:L[e.g],i:pos[e.g],c:GCOL[(L[e.g].charCodeAt(0)-65)%GCOL.length]}})}
function normG(arr){const cnt={};arr.forEach(e=>{if(e.g)cnt[e.g]=(cnt[e.g]||0)+1});arr.forEach(e=>{if(e.g&&cnt[e.g]<2)delete e.g});const out=[],seen=new Set();arr.forEach(e=>{if(!e.g){out.push(e);return}if(seen.has(e.g))return;seen.add(e.g);arr.forEach(x=>{if(x.g===e.g)out.push(x)})});arr.splice(0,arr.length,...out);return arr}
function wDur(w){return w.dur!=null?w.dur:((w.end||w.start)-w.start)}
function setWEnd(e){const w=cur();if(!(e>w.start)){toast('結束時間要晚於開始時間');rWk();return}w.end=e;w.dur=e-w.start;rWk()}
function sorted(){return S.workouts.slice().sort((a,b)=>b.start-a.start)}

const TABS=[['home','首頁','🏠'],['plan','計畫','📆'],['hist','歷史','📅'],['lib','動作','🏋️'],['tpl','課表','📋'],['set','設定','⚙️']];
function render(){
 $('tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1]}</button>`).join('');

 updFloat()}

function vHome(){
 const ws=weekStart(Date.now()),wk=S.workouts.filter(w=>w.start>=ws);let vol=0;wk.forEach(w=>vol+=wVol(w).v);
 // streak in weeks
 let streak=0,c=ws;const has=t=>S.workouts.some(w=>w.start>=t&&w.start<t+7*864e5);
 if(!has(c))c-=7*864e5;while(has(c)){streak++;c-=7*864e5}
 const days=[...Array(7)].map((_,i)=>{const t=ws+i*864e5;const on=S.workouts.some(w=>dkey(w.start)===dkey(t));return`<div style="flex:1;text-align:center"><div class="tiny">${'一二三四五六日'[i]}</div><div style="margin:4px auto 0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;${on?'background:var(--ac);color:#fff':'background:var(--card2);color:var(--tx3)'};${dkey(t)===dkey(Date.now())?'outline:2px solid var(--ac)':''}">${new Date(t).getDate()}</div></div>`}).join('');
 const last=sorted().slice(0,3);
 const bwl=S.bw.slice().sort((a,b)=>b.t-a.t)[0];
 return`<h1>練多少 💪</h1>
 ${homePlanCard()}
 <div class="card"><div class="row" style="margin-bottom:10px"><b>本週概況</b><span class="sp"></span><span class="tiny">週一起算</span></div>
 <div class="stats"><div class="stat"><b class="num">${wk.length}</b><span>本週訓練</span></div><div class="stat"><b class="num">${kfmt(vol)}</b><span>總量 (${U()})</span></div><div class="stat"><b class="num">${streak}🔥</b><span>連續週數</span></div></div>
 <div class="row" style="margin-top:12px">${days}</div></div>
 ${S.active?'':`<button class="btn pri full" style="min-height:56px;font-size:17px;margin-bottom:10px" onclick="startWorkout()">＋ 開始空白訓練</button>`}
 <h2>從課表開始</h2>
 <div class="chips">${S.templates.map(t=>`<button class="chip" onclick="startWorkout('${t.id}')">${esc(t.name)}</button>`).join('')||'<span class="muted small">尚無課表</span>'}</div>
 <h2>工具</h2>
 <div class="row" style="gap:8px;margin-bottom:12px"><button class="btn full" onclick="cardioModal()">🏃 有氧</button><button class="btn full" onclick="bwModal()">⚖️ 體重${bwl?' '+bwl.v+U():''}</button><button class="btn full" onclick="plateModal()">🧮 槓片計算</button></div>
 <h2>最近訓練</h2>${last.length>1?dragHint():''}${last.length?last.map(wCard).join(''):'<div class="card muted small">還沒有紀錄，開始第一次訓練吧！</div>'}`}
function wCard(w){if(isCardio(w))return cCard(w);const{v,n}=wVol(w);const sel=selMode&&selIds.includes(w.id);return`<div class="card wcard" data-wid="${w.id}" style="${sel?'outline:2px solid var(--ac)':''}" onclick="${selMode?`toggleSel('${w.id}')`:`viewWorkout('${w.id}')`}">${selMode?`<div class="tiny" style="color:var(--ac)">${sel?'☑︎ 已選取':'☐ 點選以選取'}</div>`:''}<div class="row"><b>${esc(w.name)}</b><span class="sp"></span><span class="tiny">${dstr(w.start)}</span></div>
 <div class="small muted" style="margin:6px 0">⏱ ${fmtDurZh(wDur(w))}${wDur(w)>3*36e5?' ⚠️ 可能忘了按完成，點進去編輯修正':''}　🏋️ ${kfmt(v)} ${U()}　✅ ${n} 組${w.prs?'　🏆 '+w.prs:''}</div>
 <div class="small">${(g=>w.ex.map((e,i)=>`${g[i]?`<b style="color:${g[i].c}">${g[i].L}${g[i].i}</b> `:''}${esc(exById(e.id).name)} × ${e.sets.filter(setDone).length}`).join('<br>'))(gInfo(w.ex))}</div></div>`}
function vHist(){
 const now=new Date();if(!calM)calM=new Date(now.getFullYear(),now.getMonth(),1).getTime();
 const m=new Date(calM),y=m.getFullYear(),mo=m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate();
 const set=new Set(S.workouts.map(w=>dkey(w.start)));let cells='一二三四五六日'.split('').map(x=>`<div class="h">${x}</div>`).join('');
 for(let i=0;i<first;i++)cells+='<div></div>';
 for(let d=1;d<=nd;d++){const k=dkey(new Date(y,mo,d));cells+=`<div class="${set.has(k)?'w':''} ${k===dkey(Date.now())?'td':''}">${d}</div>`}
 const inM=sorted().filter(w=>{const d=new Date(w.start);return d.getFullYear()===y&&d.getMonth()===mo});
 return`<h1>歷史紀錄</h1><div class="card"><div class="row" style="margin-bottom:8px"><button class="btn sm" onclick="calM=new Date(${y},${mo-1},1).getTime();render()">‹</button><b class="sp" style="text-align:center">${y} 年 ${mo+1} 月　<span class="muted small">${inM.length} 次</span></b><button class="btn sm" onclick="calM=new Date(${y},${mo+1},1).getTime();render()">›</button></div><div class="cal">${cells}</div></div>
 ${inM.length>1&&!selMode?dragHint():''}<div class="row" style="margin-bottom:10px;gap:8px">${selMode?`<button class="btn sm pri" onclick="mergeIds(selIds)">🔗 合併所選（${selIds.length}）</button><button class="btn sm" onclick="selMode=false;selIds=[];render()">取消</button>`:`<span class="sp"></span><button class="btn sm" onclick="selMode=true;selIds=[];render()">選取合併</button>`}</div>
 ${(()=>{const g={};inM.forEach(w=>(g[dkey(w.start)]=g[dkey(w.start)]||[]).push(w));return Object.keys(g).sort().reverse().map(k=>(g[k].length>1&&!selMode?`<button class="btn sm full" style="margin-bottom:8px;color:var(--ac)" onclick="mergeDay('${k}')">🔗 合併當日訓練（${k.slice(5).replace('-','/')}，${g[k].length} 筆）</button>`:'')+g[k].map(wCard).join('')).join('')})()||'<div class="muted small" style="padding:8px">本月沒有紀錄</div>'}`}
let selMode=false,selIds=[];
function toggleSel(id){selIds=selIds.includes(id)?selIds.filter(x=>x!==id):selIds.concat(id);render()}
function mergeDay(k){mergeIds(S.workouts.filter(w=>dkey(w.start)===k).map(w=>w.id))}
function mergeIds(ids,cmsg){const ws=S.workouts.filter(w=>ids.includes(w.id)).sort((a,b)=>a.start-b.start);if(ws.length<2)return toast('請選擇至少 2 筆訓練');
 if(!confirm(cmsg||`確定把這 ${ws.length} 筆訓練合併成一筆？`))return;
 const backup=JSON.stringify(S.workouts);const m=JSON.parse(JSON.stringify(ws[0]));
 m.name=[...new Set(ws.map(w=>w.name))].join('＋');m.start=ws[0].start;m.end=Math.max(...ws.map(w=>w.end||w.start));m.dur=ws.reduce((a,w)=>a+wDur(w),0);m.ex=[];{const cw=ws.find(isCardio);if(cw)m.cardio=cw.cardio;if(ws.every(isCardio))m.kind='cardio';else delete m.kind}
 ws.forEach(w=>w.ex.forEach(e=>{const c=JSON.parse(JSON.stringify(e)),f=m.ex.find(x=>x.id===c.id);if(f){f.sets=f.sets.concat(c.sets);if(c.note)f.note=[f.note,c.note].filter(Boolean).join('／')}else m.ex.push(c)}));normG(m.ex);
 S.workouts=S.workouts.filter(w=>!ids.includes(w.id));S.workouts.push(m);S.workouts.forEach(w=>w.prs=countPRs(w));save();selMode=false;selIds=[];render();
 undoToast('已合併 '+ws.length+' 筆訓練',()=>{S.workouts=JSON.parse(backup);save();render();toast('已復原')})}
function undoToast(msg,fn){const t=$('toast');t.style.pointerEvents='auto';t.innerHTML=esc(msg)+' · <button style="color:var(--ac);font-weight:700;padding:4px 8px" id="undob">復原</button>';t.style.display='block';$('undob').onclick=()=>{t.style.display='none';fn()};clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',8000)}
function vLib(){
 const q=libQ.trim().toLowerCase();const list=allEx().filter(e=>(libFilter==='全部'||e.part===libFilter||(libFilter==='自訂'&&e.custom))&&(!q||e.name.toLowerCase().includes(q)));
 return`<h1>動作庫</h1><div class="row" style="margin-bottom:10px"><input id="libq" placeholder="🔍 搜尋動作" value="${esc(libQ)}" oninput="libQ=this.value;libList()"><button class="btn pri" onclick="customExModal()">＋自訂</button></div>
 <div class="chips">${['全部',...PARTS,'自訂'].map(p=>`<button class="chip ${p===libFilter?'on':''}" onclick="libFilter='${p}';render()">${p}</button>`).join('')}</div>
 <div class="card" id="liblist">${libRows(list,'statsModal')}</div>`}
function libRows(list,fn){return list.map(e=>`<div class="list-item" onclick="${fn}('${e.id}')"><div class="sp"><div style="font-weight:600">${esc(e.name)}</div><div><span class="tag">${e.part}</span><span class="tag">${EQ[e.eq]||''}</span>${e.custom?'<span class="tag">自訂</span>':''}</div></div><span class="muted">›</span></div>`).join('')||'<div class="muted small">找不到動作</div>'}
function libList(){const q=libQ.trim().toLowerCase();$('liblist').innerHTML=libRows(allEx().filter(e=>(libFilter==='全部'||e.part===libFilter||(libFilter==='自訂'&&e.custom))&&(!q||e.name.toLowerCase().includes(q))),'statsModal')}
function vTpl(){return`<h1>課表</h1><button class="btn pri full" style="margin-bottom:12px" onclick="editTpl()">＋ 新增課表</button>
 ${S.templates.map(t=>`<div class="card"><div class="row"><b class="sp">${esc(t.name)}</b><button class="btn sm" onclick="editTpl('${t.id}')">編輯</button><button class="btn sm pri" onclick="startWorkout('${t.id}')">開始</button></div><div class="small muted" style="margin-top:6px">${t.ex.map(e=>esc(exById(e.id).name)+' '+e.n+'×'+e.r).join('、')}</div></div>`).join('')}
 <button class="btn full" onclick="if(confirm('加回預設入門課表？')){S.templates=S.templates.concat(defTemplates());save();render()}">加回預設課表</button>`}
function vSet(){const st=S.settings;return`<h1>設定</h1><div class="card">
 <div class="field"><label>預設休息時間（秒）</label><input type="number" inputmode="numeric" value="${st.rest}" onchange="S.settings.rest=Math.max(0,+this.value||0);save()"></div>
 <div class="field"><label>重量單位</label><select onchange="S.settings.unit=this.value;S.settings.bar=this.value==='kg'?20:45;save();render()"><option value="kg" ${st.unit==='kg'?'selected':''}>公斤 kg</option><option value="lb" ${st.unit==='lb'?'selected':''}>磅 lb</option></select></div>
 <div class="field"><label>槓鈴重量（${U()}）</label><input type="number" inputmode="decimal" value="${st.bar}" onchange="S.settings.bar=+this.value||0;save()"></div></div>
 <h2>資料備份</h2><div class="card"><p class="small muted" style="margin-bottom:10px">資料只存在這台手機的瀏覽器中。建議定期匯出備份（換手機或清除 Safari 資料前一定要備份）。</p>
 <button class="btn full" style="margin-bottom:8px" onclick="exportJSON()">⬇️ 匯出備份（JSON）</button>
 <button class="btn full" style="margin-bottom:8px" onclick="$('imp').click()">⬆️ 匯入備份</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
 <button class="btn full" style="margin-bottom:8px" onclick="exportCSV()">📊 匯出 CSV（Excel 可開）</button>
 <button class="btn bad full" onclick="if(confirm('確定刪除所有資料？無法復原！')&&confirm('真的確定？')){localStorage.removeItem('${KEY}');load();render()}">🗑 清除全部資料</button></div>
 <p class="tiny" style="text-align:center;margin-top:16px">練多少 v1.9 · 共 ${S.workouts.length} 次訓練 · 加到主畫面：Safari 分享 → 加入主畫面</p>`}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportJSON(){download('workout-backup-'+dkey(Date.now())+'.json',JSON.stringify(S,null,1),'application/json');toast('已匯出備份')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.workouts))throw 0;if(!confirm('匯入會覆蓋目前資料，確定？'))return;localStorage.setItem(KEY,JSON.stringify(d));load();render();toast('匯入成功')}catch(e){alert('檔案格式錯誤')}};r.readAsText(f);inp.value=''}
function exportCSV(){const rows=[['日期','訓練','超級組','動作','組','類型','重量('+U()+')','次數','完成']];sorted().forEach(w=>{const gi=gInfo(w.ex);w.ex.forEach((e,ei)=>e.sets.forEach((s,i)=>rows.push([dkey(w.start),w.name,gi[ei]?gi[ei].L+gi[ei].i:'',exById(e.id).name,i+1,STYPE[s.t],s.w,s.r+(s.m?' '+s.m+'分':'')+(s.d?' '+s.d+'km':'')+(s.sec?' '+s.sec+'秒':''),s.done?'是':'否'])));if(w.cardio){const c=w.cardio;rows.push([dkey(w.start),w.name,'','有氧-'+c.type,1,c.min+'分'+(c.dist?' '+c.dist+'km':'')+(c.hr?' HR'+c.hr:''),'','','是'])}});
 download('workouts-'+dkey(Date.now())+'.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');toast('已匯出 CSV')}
// ---------- modal ----------
function modal(html){$('mbox').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function customExModal(){modal(`<h2>新增自訂動作</h2><div class="field"><label>名稱</label><input id="cxn" placeholder="例如：史密斯深蹲"></div>
 <div class="field"><label>部位</label><select id="cxp">${PARTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
 <div class="field"><label>器材</label><select id="cxe">${Object.entries(EQ).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
 <div class="field"><label>紀錄方式</label><select id="cxt"><option value="">自動（有氧類→分鐘）</option><option value="w">重訓（重量×次數）</option><option value="c">有氧（分鐘）</option><option value="t">計時（秒）</option></select></div>
 <button class="btn pri full" onclick="addCustom()">儲存</button>`)}
function addCustom(){const n=$('cxn').value.trim();if(!n)return toast('請輸入名稱');const e={id:'c_'+uid(),name:n,part:$('cxp').value,eq:$('cxe').value,custom:true};if($('cxt').value)e.xt=$('cxt').value;S.custom.push(e);save();closeModal();if(pickCb){const cb=pickCb;pickCb=null;cb(e.id)}else render()}
// exercise history
function exHist(id,excludeId){const out=[];S.workouts.slice().sort((a,b)=>a.start-b.start).forEach(w=>{if(w.id===excludeId)return;const e=w.ex.filter(x=>x.id===id);if(!e.length)return;const sets=[].concat(...e.map(x=>x.sets)).filter(s=>setDone(s));if(!sets.length)return;
 let vol=0,best=0,bw=0,bs=null;sets.forEach(s=>{const w_=+s.w||0,r=+s.r||0;if(s.t!=='W')vol+=w_*r;const x=e1rm(w_,r);if(x>best){best=x;bs=s}if(w_>bw)bw=w_});out.push({t:w.start,wid:w.id,vol,e1:best,bw,bs,sets})});return out}
function chart(pts,label){if(pts.length<1)return'<div class="muted small">尚無資料</div>';const W=320,H=140,p=26;const ys=pts.map(x=>x.y),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1;
 const X=i=>pts.length===1?W/2:p+i*(W-p-8)/(pts.length-1),Y=v=>H-18-(v-mn)/rg*(H-34);const d=pts.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.y).toFixed(1)).join('');
 return`<svg viewBox="0 0 ${W} ${H}" width="100%"><text x="2" y="12">${kfmt(mx)}</text><text x="2" y="${H-20}">${kfmt(mn)}</text><path d="${d}" fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.y)}" r="3" fill="#ff7a1a"/>`).join('')}<text x="${p}" y="${H-3}">${new Date(pts[0].t).getMonth()+1}/${new Date(pts[0].t).getDate()}</text><text x="${W-40}" y="${H-3}">${new Date(pts[pts.length-1].t).getMonth()+1}/${new Date(pts[pts.length-1].t).getDate()}</text></svg><div class="tiny" style="text-align:center">${label}</div>`}
function statsModal(id){if(exType(id)!=='w'){const e=exById(id);return modal(`<div class="row"><h2 class="sp" style="margin-top:0">${esc(e.name)}</h2><button class="btn sm" onclick="closeModal()">關閉</button></div><div><span class="tag">${e.part}</span><span class="tag">${EQ[e.eq]||''}</span></div>${typeBtns(id)}${cardioStatsHtml(id)}${e.custom?`<button class="btn bad full" style="margin-top:12px" onclick="if(confirm('刪除此自訂動作？')){S.custom=S.custom.filter(x=>x.id!=='${id}');save();closeModal();render()}">刪除自訂動作</button>`:''}`)}const e=exById(id),h=exHist(id);const best=h.reduce((a,x)=>x.e1>a.e1?x:a,{e1:0}),bw=Math.max(0,...h.map(x=>x.bw)),tv=h.reduce((a,x)=>a+x.vol,0);
 modal(`<div class="row"><h2 class="sp" style="margin-top:0">${esc(e.name)}</h2><button class="btn sm" onclick="closeModal()">關閉</button></div><div><span class="tag">${e.part}</span><span class="tag">${EQ[e.eq]||''}</span></div>${typeBtns(id)}
 <div class="stats" style="margin:12px 0"><div class="stat"><b class="num">${nf(best.e1)}</b><span>預估 1RM</span></div><div class="stat"><b class="num">${bw}</b><span>最大重量</span></div><div class="stat"><b class="num">${h.length}</b><span>訓練次數</span></div></div>
 ${best.bs?`<div class="small muted">最佳組：${best.bs.w} ${U()} × ${best.bs.r}（${dstr(best.t)}）　累積總量 ${kfmt(tv)} ${U()}</div>`:''}
 <h2>預估 1RM 趨勢（Epley）</h2><div class="card">${chart(h.map(x=>({t:x.t,y:nf(x.e1)})),'預估 1RM ('+U()+')')}</div>
 <h2>訓練量趨勢</h2><div class="card">${chart(h.map(x=>({t:x.t,y:x.vol})),'每次總量 (重量×次數)')}</div>
 <h2>紀錄</h2>${h.slice().reverse().slice(0,30).map(x=>`<div class="list-item"><div class="sp"><div class="small">${dstr(x.t)}</div><div class="tiny">${x.sets.map(s=>s.w+'×'+s.r).join('、')}</div></div><span class="small">${nf(x.e1)}</span></div>`).join('')||'<div class="muted small">尚無紀錄</div>'}
 ${e.custom?`<button class="btn bad full" style="margin-top:12px" onclick="if(confirm('刪除此自訂動作？')){S.custom=S.custom.filter(x=>x.id!=='${id}');save();closeModal();render()}">刪除自訂動作</button>`:''}`)}
// picker
let pickCb=null,pickF='全部';
function pickEx(cb){pickCb=cb;pickF='全部';modal(`<div class="row"><h2 class="sp" style="margin-top:0">選擇動作</h2><button class="btn sm" onclick="pickCb=null;closeModal()">取消</button></div><div class="row" style="margin-bottom:8px"><input id="pq" placeholder="🔍 搜尋" oninput="pickList()"><button class="btn" onclick="customExModal()">＋自訂</button></div><div class="chips" id="pchips"></div><div id="plist"></div>`);pickList()}
function pickList(){const q=($('pq').value||'').trim().toLowerCase();$('pchips').innerHTML=['全部',...PARTS].map(p=>`<button class="chip ${p===pickF?'on':''}" onclick="pickF='${p}';pickList()">${p}</button>`).join('');
 $('plist').innerHTML=libRows(allEx().filter(e=>(pickF==='全部'||e.part===pickF)&&(!q||e.name.toLowerCase().includes(q))),'pickDone')}
function pickDone(id){const cb=pickCb;pickCb=null;closeModal();cb&&cb(id)}
// ---------- workout ----------
let editW=null;// editing past workout copy
const cur=()=>editW||S.active;
function startWorkout(tid,force){const td=sorted().find(w=>!isCardio(w)&&dkey(w.start)===dkey(Date.now()));if(!S.active&&!force&&td){modal(`<h2 style="margin-top:0">今天已經有一筆訓練</h2><p class="muted small" style="margin-bottom:12px">要接著記在「${esc(td.name)}」，還是開新的？</p><button class="btn pri full" style="margin-bottom:8px" onclick="closeModal();resumeWorkout('${td.id}')">接著記</button><button class="btn full" style="margin-bottom:8px" onclick="closeModal();startWorkout(${tid?`'${tid}'`:'undefined'},true)">開新的</button><button class="btn full" onclick="closeModal()">取消</button>`);return}
 if(S.active){if(!confirm('已有進行中的訓練，要放棄並開新的嗎？'))return openWorkout()}
 const t=S.templates.find(x=>x.id===tid);const hr=new Date().getHours();
 S.active={id:uid(),name:t?t.name:(hr<11?'早晨訓練':hr<17?'午間訓練':'晚間訓練'),start:Date.now(),ex:[]};if(t)S.active.tid=t.id;
 if(t)t.ex.forEach(e=>{const prev=lastSets(e.id);S.active.ex.push({id:e.id,g:e.g,sets:[...Array(Math.max(1,e.n))].map((_,i)=>({w:e.w||(prev[i]||prev[prev.length-1]||{}).w||'',r:e.r||'',t:'N',done:false}))})});
 save();editW=null;openWorkout()}
function lastSets(id,excl){const h=exHist(id,excl);return h.length?h[h.length-1].sets:[]}
function openWorkout(){$('wk').classList.add('on');document.body.style.overflow='hidden';rWk()}
function minimize(){setTimeout(rRest,0);$('wk').classList.remove('on');document.body.style.overflow='';if(editW){editW=null}render()}
function rWk(){const w=cur();if(!w)return minimize();const live=!editW;
 $('wkin').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="minimize()">${live?'⌄ 縮小':'取消'}</button><span class="sp" style="text-align:center;font-weight:700" class="num" id="wtimer">${live?fmtDur(Date.now()-w.start):dstr(w.start)}</span><button class="btn sm ok" onclick="finishWorkout()">${live?'完成':'儲存'}</button></div>
 <input value="${esc(w.name)}" style="font-size:20px;font-weight:700;background:transparent;border:0;padding:4px 2px" onchange="cur().name=this.value;persist()">
 ${live?'':`<div class="row small muted" style="margin:4px 0 8px">開始時間 <input type="datetime-local" style="width:auto" value="${new Date(w.start-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}" onchange="const d=wDur(cur());cur().start=new Date(this.value).getTime();cur().end=cur().start+d;rWk()"></div>
 <div class="row small muted" style="margin:0 0 8px;gap:6px;flex-wrap:wrap">結束時間 <input id="wend" type="datetime-local" style="width:auto" value="${new Date(w.start+wDur(w)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}" onchange="setWEnd(new Date(this.value).getTime())"> 總時長 <input id="wdurm" type="number" inputmode="numeric" style="width:70px" value="${Math.round(wDur(w)/6e4)}" onchange="setWEnd(cur().start+(+this.value)*6e4)"> 分鐘</div>${wDur(w)>3*36e5?'<div class="small" style="color:var(--bad,#e55);margin-bottom:8px">⚠️ 時長超過 3 小時，可能忘了按完成，請修正結束時間或總時長後按「儲存」</div>':''}`}

function tplOf(p){return p&&p.k==='w'?S.templates.find(x=>x.id===p.tid):null}
function tplZone(t){if(!t||!t.ex.length)return'F';const n=t.ex.length,l=t.ex.filter(e=>exById(e.id).part==='腿').length/n;return l>=.5?'L':l<=.2?'U':'F'}
function zoneOfW(w){if(isWorkoutCardio(w))return'C';const n=w.ex.length;if(!n)return'F';const l=w.ex.filter(e=>exById(e.id).part==='腿').length/n;return l>=.5?'L':l<=.2?'U':'F'}
function isWorkoutCardio(w){if(isCardio(w))return true;let c=0,o=0;w.ex.forEach(e=>{const d=e.sets.filter(setDone).length;if(!d)return;if(exType(e.id)==='c')c+=d;else o+=d});return c>0&&o===0}
function slotZone(p){return p.k==='c'?'C':tplZone(tplOf(p))}
function clash(a,b){if(!a||!b)return false;if(a==='C'||b==='C')return false;if(a==='U'&&b==='U')return true;return a!=='U'&&b!=='U'}// lower/full after lower/full, or upper after upper
function slotsInfo(now){now=now||Date.now();const I=weekInfo(now);
 const slots=S.plan.map((p,i)=>({i,p,z:slotZone(p),done:null})).filter(s=>s.p.k!=='r');
 const ws=S.workouts.filter(w=>w.start>=I.ws&&w.start<I.ws+7*864e5).sort((a,b)=>a.start-b.start);
 const slotOf=new Map();const free=f=>slots.filter(s=>!s.done&&f(s)).sort((a,b)=>(a.p.opt-b.p.opt)||(a.i-b.i))[0];
 ws.forEach(w=>{let s=null;const ids=w.ex.map(e=>e.id);
  if(isWorkoutCardio(w))s=free(x=>x.p.k==='c');
  else{if(w.tid)s=free(x=>x.p.k==='w'&&x.p.tid===w.tid);
   if(!s){let best=null,bs=0;slots.forEach(x=>{if(x.done||x.p.k!=='w')return;const t=tplOf(x);if(!t||!t.ex.length)return;const m=t.ex.filter(e=>ids.includes(e.id)).length/t.ex.length;if(m>bs){bs=m;best=x}});if(bs>=.5)s=best}
   if(!s){const z=zoneOfW(w);s=free(x=>x.p.k==='w'&&x.z===z)||free(x=>x.p.k==='w')}}
  if(s)s.done=w;slotOf.set(w,s)});
 // last trained day zone
 const lastW=ws[ws.length-1];
 return{I,slots,ws,lastW,slotOf}}
function pickNext(cands,prevZ,prevKind){let best=null,bs=-1e9;cands.forEach(s=>{let sc=-s.i*0.01-(s.p.opt?5:0);if(clash(prevZ,s.z))sc-=3;if(prevKind&&((prevKind==='C')===(s.z==='C')))sc-=1;if(sc>bs){bs=sc;best=s}});return best}
function flexPlan(now){now=now||Date.now();const X=slotsInfo(now),I=X.I,g=S.planGoal.min;
 const todayDone=I.days[I.today].done,start=I.today+(todayDone?1:0);
 const pend=X.slots.filter(s=>!s.done);const core=pend.filter(s=>!s.p.opt),opt=pend.filter(s=>s.p.opt);
 const need=Math.max(0,g-I.n),days=[];for(let d=start;d<7;d++)days.push(d);
 const yz=d=>{const k=I.days[d-1];if(!k||!k.done)return null;return zoneOfW(k.ws[k.ws.length-1])};
 const sched={};const pool=core.concat(need>core.length?opt:[]);const pinned=S.planEdited||{};
 days.forEach(d=>{if(pinned[d]){const s=pool.find(x=>x.i===d);if(s){sched[d]=s;pool.splice(pool.indexOf(s),1)}}});
 // choose training days: spread so a rest day remains when possible
 let free=days.filter(d=>!sched[d]),want=Math.max(0,Math.min(pool.length,need-Object.keys(sched).length));
 let chosen=[];if(want>=free.length)chosen=free.slice();else if(want>0){const st=free.length/want;for(let k=0;k<want;k++)chosen.push(free[Math.min(free.length-1,Math.floor(k*st))])}
 days.forEach(d=>{if(!chosen.includes(d)||sched[d])return;const pz=sched[d-1]?sched[d-1].z:(d===I.today+1||d===I.today)?(d===I.today?yz(d):(todayDone?yz(d):null)):null;const s=pickNext(pool,pz,pz);if(s){sched[d]=s;pool.splice(pool.indexOf(s),1)}});
 // next suggestion
 const prevZ=todayDone?zoneOfW(I.days[I.today].ws.slice(-1)[0]):yz(I.today)||(X.lastW?null:null);
 let next=sched[start]||null;if(!next){const c=core.length?core:(I.n<S.planGoal.max?opt:[]);next=pickNext(c,prevZ,prevZ)}
 return{X,I,sched,days,next,need,core,opt,start}}

// init

function hm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dragHint(){if(localStorage.getItem('wt-draghint'))return'';return`<div class="card small" id="dhint" style="display:flex;align-items:center;gap:8px;padding:10px 12px">💡 長按一筆訓練拖到另一筆上就能合併<span class="sp"></span><button class="btn sm" onclick="localStorage.setItem('wt-draghint','1');render()">知道了</button></div>`}
function dragMerge(aid,bid){const A=S.workouts.find(w=>w.id===aid),B=S.workouts.find(w=>w.id===bid);if(!A||!B||aid===bid)return;
 const e=A.start<=B.start?A:B,l=e===A?B:A;
 let m=`把『${A.name}』合併到『${B.name}』？\n\nA：${A.name}　${dstr(A.start)} ${hm(A.start)}\nB：${B.name}　${dstr(B.start)} ${hm(B.start)}\n\n合併後以較早的「${e.name}」（${hm(e.start)}）為開始時間，相同動作的組數會合在一起。`;
 if(dkey(A.start)!==dkey(B.start))m+=`\n\n⚠️ 這兩筆不是同一天，合併後會算在 ${dstr(e.start)} 那天`;
 mergeIds([aid,bid],m)}
(function(){let D=null,sup=0;const LP=400,TH=10;
 function cardAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.wcard'):null}
 function start(card,x,y,touch){if(selMode||D)return;D={card,id:card.dataset.wid,x0:x,y0:y,x,y,touch,on:false,tgt:null};D.t=setTimeout(lift,LP)}
 function lift(){if(!D)return;D.on=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  const r=D.card.getBoundingClientRect(),g=D.card.cloneNode(true);g.classList.add('dghost');g.classList.remove('wcard');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';D.dx=D.x-r.left;D.dy=D.y-r.top;document.body.appendChild(g);D.g=g;D.card.classList.add('dsrc');document.body.classList.add('dragging');window.getSelection&&getSelection().removeAllRanges();loop()}
 function move(x,y){if(!D)return false;D.x=x;D.y=y;if(!D.on){if(Math.hypot(x-D.x0,y-D.y0)>TH)cancel();return false}
  D.g.style.left=(x-D.dx)+'px';D.g.style.top=(y-D.dy)+'px';const c=cardAt(x,y);const t=c&&c!==D.card?c:null;if(t!==D.tgt){D.tgt&&D.tgt.classList.remove('dtgt');t&&t.classList.add('dtgt');D.tgt=t}return true}
 function loop(){if(!D||!D.on)return;const h=innerHeight,E=70;let v=0;if(D.y<E)v=-Math.ceil((E-D.y)/6);else if(D.y>h-E)v=Math.ceil((D.y-(h-E))/6);if(v){scrollBy(0,v);move(D.x,D.y)}D.raf=requestAnimationFrame(loop)}
 function end(){if(!D)return;const d=D;cancel();if(d.on){sup=Date.now();if(d.tgt){const a=d.id,b=d.tgt.dataset.wid;setTimeout(()=>dragMerge(a,b),30)}}}
 function cancel(){if(!D)return;clearTimeout(D.t);cancelAnimationFrame(D.raf);D.g&&D.g.remove();D.card.classList.remove('dsrc');D.tgt&&D.tgt.classList.remove('dtgt');document.body.classList.remove('dragging');D=null}
 document.addEventListener('touchstart',e=>{if(e.touches.length!==1){cancel();return}const c=e.target.closest&&e.target.closest('.wcard');if(c){const t=e.touches[0];start(c,t.clientX,t.clientY,true)}},{passive:true});
 document.addEventListener('touchmove',e=>{if(!D)return;const t=e.touches[0];if(move(t.clientX,t.clientY)||D&&D.on)e.preventDefault()},{passive:false});
 document.addEventListener('touchend',e=>{if(D&&D.on)e.preventDefault();end()},{passive:false});
 document.addEventListener('touchcancel',cancel);
 document.addEventListener('mousedown',e=>{if(e.button!==0||Date.now()-lastT<800)return;const c=e.target.closest&&e.target.closest('.wcard');if(c)start(c,e.clientX,e.clientY,false)});
 let lastT=0;document.addEventListener('touchstart',()=>lastT=Date.now(),{passive:true,capture:true});
 document.addEventListener('mousemove',e=>{if(D&&!D.touch)move(e.clientX,e.clientY)});
 document.addEventListener('mouseup',e=>{if(D&&!D.touch)end()});
 document.addEventListener('click',e=>{if(Date.now()-sup<500&&e.target.closest&&e.target.closest('.wcard')){e.stopPropagation();e.preventDefault()}},true);
 document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.wcard'))e.preventDefault()});
 addEventListener('scroll',()=>{if(D&&!D.on)cancel()},{passive:true});
})();
load();render();if(S.active)openWorkout();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{});
if('serviceWorker' in navigator&&navigator.serviceWorker.controller){let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;if(!S.rest)location.reload()})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rRest();updFloat()}});
</script>
</body>
</html>
